name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package skill
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p "zcode-gpt-image2-${VERSION}"
          cp -r zcode-gpt-image2 "zcode-gpt-image2-${VERSION}/"
          zip -r "zcode-gpt-image2-${VERSION}.zip" "zcode-gpt-image2-${VERSION}"
          tar czf "zcode-gpt-image2-${VERSION}.tar.gz" "zcode-gpt-image2-${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            zcode-gpt-image2-*.zip
            zcode-gpt-image2-*.tar.gz
